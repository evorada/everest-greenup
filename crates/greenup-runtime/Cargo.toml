[package]
name = "greenup-runtime"
description = "Threads around the pure session and driver crates: a serial or TCP port per side, persistence, serial traces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
evse-session = { workspace = true }
legrand-driver = { workspace = true }
legrand-proto = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }

[dev-dependencies]
board-model = { workspace = true }
legrand-sim = { workspace = true }

[lints]
workspace = true
