# Balena discovery release (fleet gaia_charge/greenup, raspberrypi3-64).
# Push:  balena push gaia_charge/greenup --source balena/discovery
#
# Both services idle until GREENUP_PORT is set as a service variable; see
# run-discovery.sh and README.md. host networking: greenup-link serves HTTP on
# 8080 (side1) and 8081 (side2).
version: "2.4"

services:
  side1:
    build: .
    privileged: true
    network_mode: host
    restart: unless-stopped
    environment:
      GREENUP_HTTP_ADDR: 0.0.0.0:8080
    volumes:
      - data:/data

  side2:
    build: .
    privileged: true
    network_mode: host
    restart: unless-stopped
    environment:
      GREENUP_HTTP_ADDR: 0.0.0.0:8081
    volumes:
      - data:/data

volumes:
  data: {}
